name = "wicka-assistance"
main = "src/worker.ts"
compatibility_date = "2025-06-01"

# Conserve les variables ajoutées dans le tableau de bord Cloudflare lors d'un `wrangler deploy`
keep_vars = true

# Fichiers statiques (css, js, images) servis directement depuis public/
[assets]
directory = "./public"
binding = "ASSETS"

# Cron : le 1er de chaque mois à 09h00 UTC (10h00 à Casablanca)
# -> envoie un e-mail de contrôle Brevo à BREVO_COMPANY_EMAIL (src/cron/brevo-keepalive.ts)
[triggers]
crons = ["0 9 1 * *"]

# Variables non secrètes.
# PUBLIC_SITE_URL : 1 à 3 adresses séparées par des virgules. Le site utilise celle qui
# correspond au domaine visité (.com ou workers.dev) ; le cron prend la première qui répond.
# Vide = l'origine de la requête est utilisée.
[vars]
PUBLIC_SITE_URL = "https://wickaassistance.com,https://wickaassistance.wickaassistance.workers.dev"
BREVO_COMPANY_EMAIL = "wickaassistance@gmail.com"

# Secrets et variables à ajouter (npx wrangler secret put NOM, ou tableau de bord Cloudflare) :
#   BREVO_API_KEY      (secret)
#   BREVO_FROM_EMAIL   (adresse expéditrice vérifiée dans Brevo)
#   BREVO_FROM_NAME    (ex : Wicka Assistance)
#   BREVO_LOGO_URL     (URL absolue du logo, optionnelle : sinon <site>/assets/images/logo.png)